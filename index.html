<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
</head>
<body class="login-body">
    <main class="login-container">
        <div class="logo-contenedor">
            <img src="ruta-a-tu-logo.png" alt="Logo MedAgenda" class="logo-circulo">
        </div>

        <h1>MedAgenda</h1>
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <select id="login-rol" required>
                    <option value="" disabled selected>Selecciona tu rol </option>
                    <option value="1">Doctor</option>
                    <option value="2">Paciente</option>
                </select>
            </div>

            <div class="input-group">
                <label for="login-usuario"> Nombre de Usuario:</label>
                <input type="text" id="login-usuario" required>
            </div>

            <div class="input-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="btn-login"> Iniciar Sesión </button>
        </form>

        <div class="opciones-extra">
            <a href="registro.html">¿No tienes cuenta? Regístrate</a>
        </div>
    </main>
</body>
</html>
