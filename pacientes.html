<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pacientes.css">
</head>
<body>
    <aside class="slider-bar">
        <nav>
            <div class="marca">
                <img src="img/logo.png" alt="Logo MedAgenda">
                <div>
                    <h2>MedAgenda</h2>
                    <h4>Agenda médica</h4>
                </div>
            </div>
            
            <ul class="menu-superior">
                <li><a href="dashboard.html"><img src="img/icono-dashboard.svg" alt="">Inicio</a></li>
                <li><a href="pacientes.html" class="activo"><img src="img/icono-pacientes.svg" alt="">Pacientes</a></li>
                <li><a href="consultas.html"><img src="img/icono-consultas.svg" alt="">Consultas</a></li>
                <li><a href="recetas.html"><img src="img/icono-recetas.svg" alt="">Recetas</a></li>
                <li><a href="historial.html"><img src="img/icono-historial.svg" alt="">Historial</a></li>
            </ul>
            <ul class="menu-inferior">
                <li><a href="configuracion.html"><img src="img/icono-configuracion.svg" alt="">Configuración</a></li>
                <li><a href="perfil.html"><img src="img/icono-perfil.svg" alt="">Perfil</a></li>
            </ul>
        </nav>
    </aside>

    <main class="contenido-principal">
        <header class="encabezado-pacientes">
            <div>
                <h1>Pacientes</h1>
                <h3 id="header-pacientes">0 pacientes registrados</h3>
            </div>
            <button id="btn-agregar-paciente">+ Nuevo Paciente</button>
        </header>

        <section class="tarjeta-tabla">
            <input type="text" id="input-busqueda" placeholder="Buscar por nombre o aseguradora...">

            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>Aseguradora</th>
                        <th>No. Póliza</th>
                        <th>Última Visita</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-paciente"></tbody>
            </table>
        </section>
    </main>

    
    <div id="modal-nuevo-paciente" class="modal-overlay" style="display: none;">
        <div class="modal-paciente">

            <div class="modal-encabezado">
                <h2>Nuevo Paciente</h2>
                <button type="button" id="btn-x-modal-paciente" class="btn-cerrar-x">&times;</button>
            </div>

            <form id="form-nuevo-paciente" action="#" method="POST">

                <div class="modal-cuerpo">
                    <div class="grupo-input">
                        <label for="pac-nombre">Nombre completo *</label>
                        <input type="text" id="pac-nombre" name="nombre" placeholder="Ej. María García López" required>
                    </div>

                    <div class="flex-fila">
                        <div class="grupo-input">
                            <label for="pac-nacimiento">Fecha de nacimiento *</label>
                            <input type="date" id="pac-nacimiento" name="fecha_nacimiento" required>
                        </div>
                        <div class="grupo-input">
                            <label for="pac-genero">Género *</label>
                            <select id="pac-genero" name="genero" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex-fila">
                        <div class="grupo-input">
                            <label for="pac-telefono">Teléfono *</label>
                            <input type="tel" id="pac-telefono" name="telefono" placeholder="+52 55 0000 0000" required>
                        </div>
                        <div class="grupo-input">
                            <label for="pac-correo">Correo electrónico</label>
                            <input type="email" id="pac-correo" name="correo" placeholder="paciente@email.com">
                        </div>
                    </div>

                    <div class="flex-fila">
                        <div class="grupo-input">
                            <label for="pac-aseguradora">Aseguradora *</label>
                            <input type="text" id="pac-aseguradora" name="aseguradora" placeholder="IMSS, GNP, ISSSTE..." required>
                        </div>
                        <div class="grupo-input">
                            <label for="pac-poliza">Número de póliza</label>
                            <input type="text" id="pac-poliza" name="poliza" placeholder="Ej. IMSS-784521">
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label for="pac-direccion">Dirección (opcional)</label>
                        <input type="text" id="pac-direccion" name="direccion" placeholder="Calle, colonia, ciudad">
                    </div>

                    <div class="grupo-input">
                        <label for="pac-alergias">Alergias conocidas (opcional)</label>
                        <input type="text" id="pac-alergias" name="alergias" placeholder="Ej. Penicilina, Aspirina">
                    </div>

                    <div class="grupo-input">
                        <label for="pac-contacto">Contacto de emergencia (opcional)</label>
                        <input type="text" id="pac-contacto" name="contacto_emergencia" placeholder="Nombre y teléfono">
                    </div>
                </div>

                <div class="modal-pie">
                    <button type="button" id="btn-cerrar-modal-paciente" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-principal">Guardar paciente</button>
                </div>
            </form>

        </div>
    </div>

    <script src="js/pacientes.js"></script>

 
    <script>
        document.getElementById('btn-x-modal-paciente').addEventListener('click', function () {
            document.getElementById('modal-nuevo-paciente').style.display = 'none';
        });
    </script>
</body>
</html>
