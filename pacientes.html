<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pacientes.css">
</head>
<body>
    <aside class="slider-bar">
        <nav>
            <div class="marca">
                <img src="img/logo.png" alt="Logo MedAgenda">
                <div>
                    <h2>MedAgenda</h2>
                    <h4>Agenda médica</h4>
                </div>
            </div>
            
            <ul class="menu-superior">
                <li><a href="dashboard.html"><img src="img/icono-dashboard.svg" alt="">Inicio</a></li>
                <li><a href="pacientes.html" class="activo"><img src="img/icono-pacientes.svg" alt="">Pacientes</a></li>
                <li><a href="consultas.html"><img src="img/icono-consultas.svg" alt="">Consultas</a></li>
                <li><a href="recetas.html"><img src="img/icono-recetas.svg" alt="">Recetas</a></li>
                <li><a href="historial.html"><img src="img/icono-historial.svg" alt="">Historial</a></li>
            </ul>
            <ul class="menu-inferior">
                <li><a href="configuracion.html"><img src="img/icono-configuracion.svg" alt="">Configuración</a></li>
                <li><a href="perfil.html"><img src="img/icono-perfil.svg" alt="">Perfil</a></li>
            </ul>
        </nav>
    </aside>

    <main class="contenido-principal">
        <header class="encabezado-pacientes">
            <div>
                <h1>Pacientes</h1>
                <h3 id="header-pacientes">0 pacientes registrados</h3>
            </div>
            <button id="btn-agregar-paciente">+ Nuevo Paciente</button>
        </header>

        <section class="tarjeta-tabla">
            <input type="text" id="input-busqueda" placeholder="Buscar por nombre o aseguradora...">

            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>Aseguradora</th>
                        <th>No. Póliza</th>
                        <th>Última Visita</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-paciente"></tbody>
            </table>
        </section>
    </main>
    <div id="modal-nuevo-paciente" class="modal-overlay" style="display: none;">
    

    <div class="modal-contenido" style="max-width: 700px; text-align: left;">
        
        <h2 style="margin-top: 0; color: var(--teal-oscuro);">Registrar Nuevo Paciente</h2>
        <hr style="border: 0; border-top: 1px solid var(--borde); margin-bottom: 20px;">

        <form id="form-nuevo-paciente" action="#" method="POST">
            
                <div class="grupo-input">
                    <label for="pac-nombre">Nombre Completo</label>
                    <input type="text" id="pac-nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="flex-fila" style="display: flex; gap: 20px;">
                    <div class="grupo-input" style="flex: 1;">
                        <label for="pac-nacimiento">Nacimiento</label>
                        <input type="date" id="pac-nacimiento" name="fecha_nacimiento" required>
                    </div>

                    <div class="grupo-input" style="flex: 1;">
                        <label for="pac-genero">Género</label>
                        <select id="pac-genero" name="genero" required>
                            <option value="" disabled selected>Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                </div>

                <div class="flex-fila" style="display: flex; gap: 20px;">
                    <div class="grupo-input" style="flex: 1;">
                        <label for="pac-telefono">Teléfono</label>
                        <input type="tel" id="pac-telefono" name="telefono" required>
                    </div>
                    <div class="grupo-input" style="flex: 1;">
                        <label for="pac-aseguradora">Aseguradora</label>
                        <select id="pac-aseguradora" name="aseguradora">
                            <option value="Particular" selected>Particular</option>
                            <option value="IMSS">IMSS</option>
                            <option value="ISSSTE">ISSSTE</option>
                        </select>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="pac-alergias">Alergias / Notas</label>
                    <textarea id="pac-alergias" name="alergias" rows="2"></textarea>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="button" id="btn-cerrar-modal-paciente" class="btn-secundario" style="flex: 1; padding: 12px; background: transparent; border: 1px solid var(--texto-suave); color: var(--texto-suave); border-radius: 8px; cursor: pointer;">Cancelar</button>
                    <button type="submit" class="btn-principal" style="flex: 2;">Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/pacientes.js"></script>
</body>
</html>
