<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarte</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <main class="contenedor-pantalla-dividida">

        <section class="seccion-imagen">

            <div class="texto-sobre-imagen">
                <h2>Únete a MedAgenda</h2>
                <p>La mejor forma de organizar tus consultas</p>
            </div>
        </section>

        <section class="seccion-formulario">
            <div class="caja-registro">
                <h1>Registrarse</h1>
                
                <form id="registro-form" action="#" method="POST">
                    <div class="grupo-input">
                        <label for="login-rol">Me quiero registrar como:</label>
                        <select id="login-rol" name="rol" required>
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="paciente" selected>Paciente</option>
                            <option value="medico">Médico</option>
                        </select>
                    </div>

                    <div class="grupo-input">
                        <label for="reg-nombre">Nombre Completo:</label>
                        <input type="text" id="reg-nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="grupo-input">
                        <label for="reg-correo">Correo Electrónico:</label>
                        <input type="email" id="reg-correo" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="grupo-input">
                        <label for="reg-password">Contraseña:</label>
                        <input type="password" id="reg-password" name="password" placeholder="Crea una contraseña segura" required>
                    </div>

                    <div class="grupo-input" id="campo-autorizacion-medico">
                        <label for="reg-codigo">Código de Autorización / Cédula:</label>
                        <input type="text" id="reg-codigo" name="codigo_medico" placeholder="Ingresa el código proporcionado por la clínica">
                        <small style="color: #666; font-size: 12px;">Tu cuenta requerirá aprobación de un administrador.</small>
                    </div>
                    <button type="submit" id="btn-registrar" class="btn-principal">Crear Cuenta</button>

                </form>

                <div class="separador-social">
                    <span>O regístrate con</span>
                </div>

                <div class="opciones-sociales">
                    <button type="button" class="btn-secundario btn-google" id="btn-google">Continuar con Google</button>
                </div>

                <div class="opciones-extra">
                    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
                </div>

            </div>
        </section>

    </main>
    <div id="modal-exito" class="modal-overlay" style="display: none;">
        <div class="modal-contenido">
        
            <div class="modal-icono">✓</div>
            <h2 id="modal-titulo">¡Cuenta creada!</h2>
            <p id="modal-mensaje">Tu registro se ha completado con éxito.</p>
            <button type="button" id="btn-cerrar-modal" class="btn-principal">Entendido</button>
        </div>
    </div>
</body>
</html>
